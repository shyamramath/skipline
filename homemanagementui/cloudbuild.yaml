steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/homemanagement-repo/homemanagement-ui:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/homemanagement-repo/homemanagement-ui:latest'
      - '.'

  # Push the Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/homemanagement-repo/homemanagement-ui:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/homemanagement-repo/homemanagement-ui:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'homemanagement-ui'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/homemanagement-repo/homemanagement-ui:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/homemanagement-repo/homemanagement-ui:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/homemanagement-repo/homemanagement-ui:latest'

options:
  logging: CLOUD_LOGGING_ONLY
